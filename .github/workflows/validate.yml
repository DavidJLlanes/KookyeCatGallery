name: Validate website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate PHP and JavaScript
        run: |
          set -eu
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/photo-editor.js
          node --check assets/js/photo-filter-engine.js
          node --check assets/js/photo-editor-presets.js
          node --check tests/photo-presets.cjs
          node --check tests/photo-editor.cjs
          node --check assets/js/photo-manager.js
          node --check assets/js/main.js
          node --check assets/js/pwa.js
          node --check assets/js/admin-ui.js
          node --check assets/premium/deck/deck.js
          node --check assets/js/site-texts.js
          node --check tests/photo-navigation.cjs
          node --check tests/photo-transition.cjs
          node --check tests/photo-likes.cjs
      - name: Test photo presets
        run: node tests/photo-presets.cjs
      - name: Test site settings
        run: php tests/site-settings.php
      - name: Test photo neighbors
        run: php tests/photo-navigation.php
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/site-browser-tools --no-save playwright@1.58.2
          /tmp/site-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Test responsive design
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/site-design.cjs
      - name: Test live gallery layouts and pagination
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/gallery-layout.cjs
      - name: Test pagination shape
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/pagination-shape.cjs
      - name: Test slideshow
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/slideshow.cjs
      - name: Test premium deck gallery
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/premium-deck.cjs
      - name: Test premium bubbles gallery
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/premium-bubbles.cjs
      - name: Test premium squares gallery
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/premium-squares.cjs
      - name: Test premium drum gallery
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/premium-drum.cjs
      - name: Test premium cylinder gallery
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/premium-cylinder.cjs
      - name: Test premium polaroid gallery
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/premium-polaroid.cjs
      - name: Test premium swipe gallery
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/premium-swipe.cjs
      - name: Test categories visibility
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/categories-visibility.cjs
      - name: Test rendered admin settings layout
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/admin-layout.cjs
      - name: Test smooth photo transition
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/photo-transition.cjs
      - name: Test photo navigation
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/photo-navigation.cjs
      - name: Test photo likes
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/photo-likes.cjs
      - name: Test photo editor
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/photo-editor.cjs
