name: Validate website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Sintaxis, estructura y pruebas PHP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, fileinfo, mbstring, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis, estructura, catálogos, ajustes, microblog, instalación y actualización
        run: node tests/run-all.cjs --fast

  browser:
    name: Pruebas de navegador
    runs-on: ubuntu-24.04
    needs: fast
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, fileinfo, mbstring, pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Herramientas de navegador
        run: |
          npm install --prefix /tmp/site-browser-tools --no-save playwright@1.58.2
          /tmp/site-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Pruebas de navegador (sin la matriz visual, cuya referencia se genera en local)
        env:
          NODE_PATH: /tmp/site-browser-tools/node_modules
        run: node tests/run-all.cjs --no-visual
